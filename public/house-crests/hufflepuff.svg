<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <title>Hufflepuff</title>
  <defs>
    <clipPath id="h-clip">
      <path d="M8,8 L92,8 L92,72 Q92,105 50,118 Q8,105 8,72Z"/>
    </clipPath>
  </defs>

  <!-- Shield background (black) -->
  <path d="M8,8 L92,8 L92,72 Q92,105 50,118 Q8,105 8,72Z" fill="#1A1500"/>

  <g clip-path="url(#h-clip)">
    <!-- Body (low, stocky badger) -->
    <ellipse cx="50" cy="92" rx="26" ry="18" fill="#D4A820"/>
    <!-- Front legs and claws -->
    <path d="M30,100 L24,112 M24,112 L19,118 M24,112 L24,119 M24,112 L29,118"
          stroke="#D4A820" stroke-width="3" stroke-linecap="round"/>
    <path d="M70,100 L76,112 M76,112 L71,118 M76,112 L76,119 M76,112 L81,118"
          stroke="#D4A820" stroke-width="3" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="50" cy="62" rx="24" ry="22" fill="#D4A820"/>

    <!-- Ears -->
    <circle cx="30" cy="45" r="8" fill="#D4A820"/>
    <circle cx="70" cy="45" r="8" fill="#D4A820"/>
    <circle cx="30" cy="45" r="4" fill="#A07810" opacity="0.6"/>
    <circle cx="70" cy="45" r="4" fill="#A07810" opacity="0.6"/>

    <!-- White center stripe (nose to forehead) -->
    <path d="M50,42 L50,78" stroke="white" stroke-width="13" stroke-linecap="round" fill="none"/>

    <!-- Black side stripes -->
    <path d="M32,46 Q28,52 29,60 Q31,68 36,72" stroke="#111111" stroke-width="11"
          fill="none" stroke-linecap="round"/>
    <path d="M68,46 Q72,52 71,60 Q69,68 64,72" stroke="#111111" stroke-width="11"
          fill="none" stroke-linecap="round"/>

    <!-- Eyes (on gold part between stripes) -->
    <circle cx="41" cy="58" r="4.5" fill="#111111"/>
    <circle cx="59" cy="58" r="4.5" fill="#111111"/>
    <circle cx="41" cy="58" r="2.5" fill="#DDAA00"/>
    <circle cx="59" cy="58" r="2.5" fill="#DDAA00"/>
    <circle cx="41" cy="58" r="1.2" fill="#111111"/>
    <circle cx="59" cy="58" r="1.2" fill="#111111"/>
    <circle cx="41.8" cy="57.2" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="59.8" cy="57.2" r="0.8" fill="white" opacity="0.5"/>

    <!-- Nose -->
    <ellipse cx="50" cy="70" rx="5.5" ry="4" fill="#333333"/>
    <ellipse cx="49.5" cy="69.5" rx="2.5" ry="1.8" fill="#555555"/>

    <!-- Mouth -->
    <path d="M50,74 L50,78" stroke="#888888" stroke-width="1.5"/>
    <path d="M44,78 Q50,82 56,78" stroke="#888888" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Whisker dots -->
    <circle cx="37" cy="70" r="1.2" fill="#A07810" opacity="0.6"/>
    <circle cx="37" cy="74" r="1.2" fill="#A07810" opacity="0.6"/>
    <circle cx="63" cy="70" r="1.2" fill="#A07810" opacity="0.6"/>
    <circle cx="63" cy="74" r="1.2" fill="#A07810" opacity="0.6"/>
  </g>

  <!-- Shield border -->
  <path d="M8,8 L92,8 L92,72 Q92,105 50,118 Q8,105 8,72Z"
        fill="none" stroke="#FFD700" stroke-width="3"/>
  <path d="M14,14 L86,14 L86,72 Q86,101 50,113 Q14,101 14,72Z"
        fill="none" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
</svg>
