<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <title>Ravenclaw</title>
  <defs>
    <clipPath id="r-clip">
      <path d="M8,8 L92,8 L92,72 Q92,105 50,118 Q8,105 8,72Z"/>
    </clipPath>
  </defs>

  <!-- Shield background -->
  <path d="M8,8 L92,8 L92,72 Q92,105 50,118 Q8,105 8,72Z" fill="#0E1A40"/>

  <g clip-path="url(#r-clip)">
    <!-- Left wing -->
    <path d="M50,58 Q40,50 22,40 Q12,36 10,44 Q9,52 20,56 Q35,62 46,68Z" fill="#946B2D"/>
    <path d="M46,68 Q35,62 20,56" stroke="#6B4A18" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M44,74 Q32,68 18,62" stroke="#6B4A18" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M42,80 Q30,76 18,72" stroke="#6B4A18" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- Right wing -->
    <path d="M50,58 Q60,50 78,40 Q88,36 90,44 Q91,52 80,56 Q65,62 54,68Z" fill="#946B2D"/>
    <path d="M54,68 Q65,62 80,56" stroke="#6B4A18" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M56,74 Q68,68 82,62" stroke="#6B4A18" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M58,80 Q70,76 82,72" stroke="#6B4A18" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- Body -->
    <ellipse cx="50" cy="78" rx="12" ry="20" fill="#946B2D"/>
    <!-- Tail feathers -->
    <path d="M44,96 L40,110 M48,97 L46,112 M52,97 L54,112 M56,96 L60,110"
          stroke="#946B2D" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="45" y="54" width="10" height="10" rx="4" fill="#946B2D"/>

    <!-- Head -->
    <circle cx="50" cy="46" r="12" fill="#946B2D"/>
    <!-- Crown feathers -->
    <line x1="44" y1="36" x2="42" y2="27" stroke="#946B2D" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="34" x2="50" y2="24" stroke="#946B2D" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="56" y1="36" x2="58" y2="27" stroke="#946B2D" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Eyes -->
    <circle cx="43" cy="44" r="4.5" fill="#0E1A40"/>
    <circle cx="57" cy="44" r="4.5" fill="#0E1A40"/>
    <circle cx="43" cy="44" r="2.8" fill="#C8921A"/>
    <circle cx="57" cy="44" r="2.8" fill="#C8921A"/>
    <circle cx="43" cy="44" r="1.4" fill="#060E24"/>
    <circle cx="57" cy="44" r="1.4" fill="#060E24"/>
    <circle cx="43.8" cy="43.2" r="0.8" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="57.8" cy="43.2" r="0.8" fill="#FFFFFF" opacity="0.5"/>

    <!-- Beak (hooked downward) -->
    <path d="M46,50 Q50,49 54,50 L52,58 Q50,60 48,58Z" fill="#6B4A18"/>
    <path d="M48,58 Q50,62 52,58" stroke="#6B4A18" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Shield border -->
  <path d="M8,8 L92,8 L92,72 Q92,105 50,118 Q8,105 8,72Z"
        fill="none" stroke="#946B2D" stroke-width="3"/>
  <path d="M14,14 L86,14 L86,72 Q86,101 50,113 Q14,101 14,72Z"
        fill="none" stroke="#946B2D" stroke-width="1" opacity="0.4"/>
</svg>
