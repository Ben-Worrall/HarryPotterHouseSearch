<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <title>Slytherin</title>
  <defs>
    <clipPath id="s-clip">
      <path d="M8,8 L92,8 L92,72 Q92,105 50,118 Q8,105 8,72Z"/>
    </clipPath>
  </defs>

  <!-- Shield background -->
  <path d="M8,8 L92,8 L92,72 Q92,105 50,118 Q8,105 8,72Z" fill="#1A472A"/>

  <g clip-path="url(#s-clip)">
    <!-- Serpent body — thick S-curve -->
    <path d="M50,106 Q30,100 26,84 Q22,68 36,62 Q50,56 56,44 Q62,30 50,22"
          stroke="#C0C0C0" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Subtle scale texture -->
    <path d="M50,106 Q30,100 26,84 Q22,68 36,62 Q50,56 56,44 Q62,30 50,22"
          stroke="#888888" stroke-width="2" fill="none" stroke-linecap="round"
          stroke-dasharray="2,10" opacity="0.5"/>

    <!-- Head -->
    <ellipse cx="50" cy="20" rx="12" ry="9" fill="#C0C0C0"/>
    <!-- Lower jaw wider -->
    <path d="M40,22 Q40,30 48,32 L52,32 Q60,30 60,22Z" fill="#A8A8A8"/>
    <!-- Eyes (slit pupils) -->
    <circle cx="44" cy="18" r="3" fill="#1A472A"/>
    <ellipse cx="44" cy="18" rx="1" ry="2.5" fill="#0A2016"/>
    <circle cx="56" cy="18" r="3" fill="#1A472A"/>
    <ellipse cx="56" cy="18" rx="1" ry="2.5" fill="#0A2016"/>
    <!-- Eye shine -->
    <circle cx="44.8" cy="17" r="0.9" fill="#CCCCCC" opacity="0.6"/>
    <circle cx="56.8" cy="17" r="0.9" fill="#CCCCCC" opacity="0.6"/>
    <!-- Forked tongue -->
    <path d="M50,32 L50,42" stroke="#8B0000" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M50,42 L44,50" stroke="#8B0000" stroke-width="2" stroke-linecap="round"/>
    <path d="M50,42 L56,50" stroke="#8B0000" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Shield border -->
  <path d="M8,8 L92,8 L92,72 Q92,105 50,118 Q8,105 8,72Z"
        fill="none" stroke="#C0C0C0" stroke-width="3"/>
  <path d="M14,14 L86,14 L86,72 Q86,101 50,113 Q14,101 14,72Z"
        fill="none" stroke="#C0C0C0" stroke-width="1" opacity="0.4"/>
</svg>
